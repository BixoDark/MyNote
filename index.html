<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Note -- Gestor de Tareas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/stile.cssgit">
    <script type="module" src="assets/js/App.js"></script>
</head>

<body class="bg-light text-dark container-fluid p-0">
    <header class="bg-dark text-white py-3 mb-4 shadow-sm text-center">
        <div class="container-xl px-3 mx-auto mt-4 d-flex flex-column align-items-center">
            <h1 class="h3 mb-0 d-flex align-items-center justify-content-center">
                <i class="bi bi-check2-square me-2 text-primary"></i>My Note.
            </h1>
            <p class="mt-2 text-light opacity-75">Tu gestor de tareas en tan solo pocos pasos</p>
        </div>
    </header>
    <main class="container-xl px-3 pb-5">
        <section class="card shadow border-0 mb-4">
            <div class="card-body p-4">
                <h2 class="h5 card-title mb-3 d-flex align-items-center">
                    <i class="bi bi-plus-circle me-2 text-primary"></i>Nueva tarea
                </h2>
                <form id="formTarea" novalidate>
                    <div class="row g-3">
                        <div class="col-12 col-md-8 col-lg-9">
                            <label for="tareaTexto" class="form-label fw-semibold small ">Tarea</label>
                            <input type="text" class="form-control" id="tareaTexto" placeholder="Escribe la tarea..."
                                required>
                        </div>
                        <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                            <label for="tipoTarea" class="form-label fw-semibold small">Categoría</label>
                            <select class="form-select" id="tipoTarea" required>
                                <option value="" selected disabled>Selecciona...</option>
                                <option value="importante">⚠️ Importante</option>
                                <option value="relevante">⚡ Relevante</option>
                                <option value="nota">📝 Nota</option>
                                <option value="compra">🛒 Compra</option>
                            </select>
                        </div>
                        <div class="col-12 col-sm-6 col-md-4">
                            <label for="fechaTarea" class="form-label fw-semibold small">Fecha (opcional)</label>
                            <input type="date" class="form-control" id="fechaTarea">
                        </div>
                        <div class="col-12 col-sm-6 col-md-4">
                            <label for="horaTarea" class="form-label fw-semibold small">Hora (opcional)</label>
                            <input type="time" class="form-control" id="horaTarea">
                        </div>
                        <div class="col-12 col-sm-6 col-md-4 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary w-100 py-2">
                                <i class="bi bi-plus-lg me-1"></i>Agregar Tarea
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </section>
        <div class="row g-4">
            <div class="col-12">
                <section class="card border-0 shadow-sm overflow-hidden">
                    <div class="card-header bg-danger text-white py-3">
                        <h2 class="h5 mb-0 d-flex align-items-center">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>Tareas Importantes
                        </h2>
                    </div>
                    <div class="card-body p-4">
                        <ul class="list-group list-group-flush d-none" id="listaImportantes"></ul>
                        <p class="text-muted mb-0 small text-center py-3" id="vacioImportantes">
                            <i class="bi bi-inbox d-block display-6 text-secondary mb-2"></i> No hay tareas importantes
                            pendientes.
                        </p>
                    </div>
                </section>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <section class="card border-0 shadow-sm h-100 overflow-hidden">
                    <div class="card-header bg-warning text-dark py-3">
                        <h3 class="h6 mb-0 d-flex align-items-center fw-bold">
                            <i class="bi bi-lightning-charge-fill me-2"></i>Tareas Relevantes
                        </h3>
                    </div>
                    <div class="card-body p-3">
                        <ul class="list-group list-group-flush d-none" id="listaRelevantes"></ul>
                        <p class="text-muted mb-0 small text-center py-2" id="vacioRelevantes">Sin tareas relevantes.
                        </p>
                    </div>
                </section>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <section class="card border-0 shadow-sm h-100 overflow-hidden">
                    <div class="card-header bg-primary text-white py-3">
                        <h3 class="h6 mb-0 d-flex align-items-center">
                            <i class="bi bi-journal-text me-2"></i>Notas
                        </h3>
                    </div>
                    <div class="card-body p-3">
                        <ul class="list-group list-group-flush d-none" id="listaNotas"></ul>
                        <p class="text-muted mb-0 small text-center py-2" id="vacioNotas">Ninguna nota aún.</p>
                    </div>
                </section>
            </div>
            <div class="col-12 col-md-12 col-lg-4">
                <section class="card border-0 shadow-sm h-100 overflow-hidden">
                    <div class="card-header bg-success text-white py-3">
                        <h3 class="h6 mb-0 d-flex align-items-center">
                            <i class="bi bi-cart-fill me-2"></i>Compras
                        </h3>
                    </div>
                    <div class="card-body p-3">
                        <ul class="list-group list-group-flush d-none" id="listaCompras"></ul>
                        <p class="text-muted mb-0 small text-center py-2" id="vacioCompras">Lista de compras vacía.</p>
                    </div>
                </section>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
